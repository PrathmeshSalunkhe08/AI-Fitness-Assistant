<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Trainer - Posture | House of Fitness</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .page-container {
            padding: var(--spacing-xl) var(--spacing-md);
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 160px);
        }
        
        .content-box {
            background: var(--glass-bg);
            border-radius: var(--border-radius);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-medium);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.5s ease-out;
            width: 100%;
        }

        h1.page-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xl);
            font-size: 1.15rem;
        }

        .posture-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--spacing-md);
        }

        .posture-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            padding: var(--spacing-lg);
            text-decoration: none;
            color: var(--text-primary);
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-size: 1.4rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-light);
            font-family: inherit;
        }

        .posture-btn:hover {
            transform: translateY(-5px);
            background: rgba(255, 0, 0, 0.2);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 0, 0, 0.2);
        }

        .posture-btn .icon {
            font-size: 3rem;
            transition: transform 0.3s ease;
        }

        .posture-btn:hover .icon {
            transform: scale(1.15);
        }
    </style>
</head>
<body>
    <header class="dashboard-header">
        <div class="header-center">
            <img src="/static/images/gym-logo.png" alt="House of Fitness Logo" class="header-logo">
            <h1 class="brand-name">House of Fitness</h1>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-btn">Dashboard</a>
            <a href="/about" class="nav-btn">About Us</a>
            <a href="/logout" class="nav-btn logout-btn">Logout</a>
        </div>
    </header>

    <main class="dashboard-main">
        <div class="page-container">
            <div class="content-box">
                <h1 class="page-title"><img src="/static/images/Posture%20Detection%20And%20Correction.png" class="title-icon" alt="icon"> Posture Detection</h1>
                <p class="subtitle">Select an exercise to begin real-time AI posture analysis and correction.</p>
                
                <form method="POST" class="posture-grid">
                    <button name="exercise" value="bicep" type="submit" class="posture-btn">
                        <span class="icon">💪</span> Bicep Curl
                    </button>
                    <button name="exercise" value="squat" type="submit" class="posture-btn">
                        <span class="icon">🦵</span> Squat
                    </button>
                    <button name="exercise" value="pushup" type="submit" class="posture-btn">
                        <span class="icon">🏃</span> Pushup
                    </button>
                    <button name="exercise" value="shoulder" type="submit" class="posture-btn">
                        <span class="icon">🏋️</span> Shoulder Press
                    </button>
                </form>
                
                <div style="margin-top: 30px; text-align: center;">
                    <a href="/" style="display: inline-block; padding: 12px 30px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); color: white; transition: all 0.3s ease;">⬅ Back to Dashboard</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="watermark">
        <p>&copy; 2026 House of Fitness. Transform Your Body. Optimize Your Nutrition. Perfect Your Posture. Powered by Intelligent AI.</p>
    </footer>
</body>
</html>
