<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition Calculator | House of Fitness</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .page-container {
            padding: var(--spacing-xl) var(--spacing-md);
            max-width: 800px;
            margin: 0 auto;
        }
        
        .content-box {
            background: var(--glass-bg);
            border-radius: var(--border-radius);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-medium);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.5s ease-out;
        }

        h1.page-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: var(--spacing-lg);
            color: var(--text-primary);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            margin-bottom: var(--spacing-md);
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all var(--transition-fast);
            box-sizing: border-box;
        }

        input::placeholder { color: rgba(255, 255, 255, 0.5); }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
            background: rgba(0, 0, 0, 0.5);
        }

        button#calculateBtn {
            display: block;
            width: 100%;
            background: var(--secondary-gradient);
            color: var(--text-light);
            padding: 15px;
            border-radius: 8px;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            margin-top: 20px;
        }

        button#calculateBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 204, 204, 0.4);
            outline: 2px solid rgba(255, 255, 255, 0.5);
        }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .suggestion-item {
            padding: 12px 15px;
            cursor: pointer;
            color: white;
            transition: background 0.2s;
            border-bottom: 1px solid #333;
        }

        .suggestion-item:last-child { border-bottom: none; }

        .suggestion-item:hover {
            background: rgba(255, 0, 0, 0.3);
        }

        .result-card {
            margin-top: var(--spacing-xl);
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: var(--spacing-lg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
            animation: fadeInUp 0.5s ease-out;
        }

        .result-card h2 {
            color: var(--accent-color);
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .result-box {
            color: var(--text-primary);
            margin-bottom: 20px;
            font-size: 1.1rem;
            line-height: 1.6;
            text-align: center;
        }
    </style>
</head>
<body>
    <header class="dashboard-header">
        <div class="header-center">
            <img src="/static/images/gym-logo.png" alt="House of Fitness Logo" class="header-logo">
            <h1 class="brand-name">House of Fitness</h1>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-btn">Dashboard</a>
            <a href="/about" class="nav-btn">About Us</a>
            <a href="/logout" class="nav-btn logout-btn">Logout</a>
        </div>
    </header>

    <main class="dashboard-main">
        <div class="page-container">
            <div class="content-box">
                <h1 class="page-title"><img src="/static/images/Nutrition%20Tracker.png" class="title-icon" alt="icon"> Nutrition Calculator</h1>

                <div class="input-group">
                    <label>Food Name</label>
                    <input type="text" id="foodInput" placeholder="Type rice, eggs, chicken etc..." autocomplete="off">
                    <div id="suggestions" class="suggestions"></div>
                </div>

                <div class="input-group">
                    <label>Quantity (grams)</label>
                    <input type="number" id="quantityInput" placeholder="Enter quantity in grams" min="1">
                </div>

                <button type="button" id="calculateBtn">Calculate Nutrition</button>

                <div class="result-card" id="resultCard">
                    <h2>Nutrition Result</h2>
                    <div id="result" class="result-box"></div>
                    <canvas id="nutritionChart"></canvas>
                </div>
                
                <div style="margin-top: 30px; text-align: center;">
                    <a href="/" style="display: inline-block; padding: 12px 30px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); color: white; transition: all 0.3s ease;">⬅ Back to Dashboard</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="watermark">
        <p>&copy; 2026 House of Fitness. Transform Your Body. Optimize Your Nutrition. Perfect Your Posture. Powered by Intelligent AI.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/nutrition.js') }}"></script>
    <script>
        // Override nutrition.js to show card natively
        const originalBtn = document.getElementById('calculateBtn');
        const card = document.getElementById('resultCard');
        originalBtn.addEventListener('click', () => {
            setTimeout(() => {
                if (document.getElementById('result').innerHTML !== "") {
                    card.style.display = "block";
                }
            }, 500); // Check after fetch
        });
    </script>
</body>
</html>
