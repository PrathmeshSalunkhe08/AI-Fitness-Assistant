<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live AI Trainer | House of Fitness</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .page-container {
            padding: var(--spacing-xl) var(--spacing-md);
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .content-box {
            background: var(--glass-bg);
            border-radius: var(--border-radius);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-medium);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.5s ease-out;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1.page-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: var(--spacing-lg);
            color: var(--accent-color);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .video-wrapper {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 0, 0, 0.3);
            position: relative;
        }

        .camera-feed {
            width: 100%;
            display: block;
        }

        .status-box {
            margin-top: var(--spacing-md);
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            color: #ccffcc; /* Default Good */
            transition: color 0.3s;
        }
        
        .status-box.error-mode {
            color: #ffcccc;
            border-color: #ff4d4d;
            background: rgba(255, 0, 0, 0.2);
        }

        .btn-stop {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: #ffffff;
            font-size: 1.2rem;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
            margin-top: var(--spacing-xl);
            font-weight: 700;
        }

        .btn-stop:hover {
            background: linear-gradient(135deg, #c82333 0%, #a02622 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.5);
        }
    </style>
</head>
<body>
    <header class="dashboard-header">
        <div class="header-center">
            <img src="/static/images/gym-logo.png" alt="House of Fitness Logo" class="header-logo">
            <h1 class="brand-name">House of Fitness</h1>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-btn">Dashboard</a>
            <a href="/about" class="nav-btn">About Us</a>
            <a href="/logout" class="nav-btn logout-btn">Logout</a>
        </div>
    </header>

    <main class="dashboard-main">
        <div class="page-container">
            <div class="content-box">
                <h1 class="page-title">🔴 Live AI Trainer</h1>
                
                <div class="video-wrapper">
                    <img src="{{ url_for('video_feed') }}" alt="Live Video Feed" class="camera-feed">
                </div>

                <div class="status-box" id="statusBox">Initializing posture detection...</div>

                <form action="/posture/stop" style="margin-bottom: 20px;">
                    <button type="submit" class="btn-stop">⛔ Finish Exercise</button>
                </form>

                <div style="text-align: center;">
                    <a href="/" style="display: inline-block; padding: 12px 30px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); color: white; transition: all 0.3s ease;">⬅ Back to Dashboard</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="watermark">
        <p>&copy; 2026 House of Fitness. Transform Your Body. Optimize Your Nutrition. Perfect Your Posture. Powered by Intelligent AI.</p>
    </footer>

    <script>
        let lastSpoken = 0;
        const INTERVAL = 3000;
        const statusBox = document.getElementById('statusBox');

        function speak(text) {
            const now = Date.now();
            if (now - lastSpoken < INTERVAL) return;
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = "en-US";
            speechSynthesis.cancel();
            speechSynthesis.speak(msg);
            lastSpoken = now;
        }

        setInterval(() => {
            fetch("/posture_status")
                .then(res => res.json())
                .then(data => {
                    if (data.wrong) {
                        speak(data.feedback);
                        statusBox.textContent = "⚠️ " + data.feedback;
                        statusBox.classList.add("error-mode");
                    } else {
                        statusBox.textContent = "✅ Excellent Form! Keep it up.";
                        statusBox.classList.remove("error-mode");
                    }
                })
                .catch(error => {
                    statusBox.textContent = "Connecting to AI...";
                });
        }, 500);
    </script>
</body>
</html>
