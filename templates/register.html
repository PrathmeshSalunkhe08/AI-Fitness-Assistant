<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | House of Fitness</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        
        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .auth-box {
            background: var(--glass-bg);
            padding: var(--spacing-xl) var(--spacing-lg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-medium);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: fadeInUp 0.5s ease-out;
        }

        .auth-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            object-fit: cover;
        }

        .auth-box h2 {
            font-size: 2rem;
            margin-bottom: 5px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: var(--spacing-lg);
            font-size: 1rem;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .auth-form input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all var(--transition-fast);
            box-sizing: border-box;
        }

        .auth-form input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .auth-form input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
            background: rgba(0, 0, 0, 0.5);
        }

        .auth-form button {
            background: var(--secondary-gradient);
            color: var(--text-light);
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            margin-top: 10px;
            width: 100%;
        }

        .auth-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 204, 204, 0.4);
            outline: 2px solid rgba(255, 255, 255, 0.5);
        }

        .auth-link {
            margin-top: var(--spacing-lg);
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .auth-link a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .auth-link a:hover {
            color: white;
            text-shadow: 0 0 5px var(--accent-color);
        }

        .flash {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: left;
        }

        .flash.error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5);
            color: #ffcccc;
        }

        .flash.success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #ccffcc;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <img src="/static/images/gym-logo.png" alt="House of Fitness" class="auth-logo">
            <h2>House of Fitness</h2>
            <p class="subtitle">Create your personal AI fitness account</p>

            <!-- 🔔 FLASH MESSAGE -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form class="auth-form" method="POST">
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="email" name="email" placeholder="Email Address" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Create Account</button>
            </form>

            <p class="auth-link">Already have an account? <a href="/login">Log In</a></p>
        </div>
    </div>
</body>
</html>
